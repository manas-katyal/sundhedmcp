{{- if .Values.kagent.enabled }}
{{- $k := .Values.kagent }}
{{- $multi := include "sundhedmcp.multiUser" . }}
{{- $headerSecret := printf "%s-kagent" (include "sundhedmcp.fullname" .) }}
{{- if not $multi }}
# kagent reads header Secrets from its own namespace: a copy of the
# Authorization value, made from the API token Secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $headerSecret }}
  namespace: {{ $k.namespace }}
  labels:
    {{- include "sundhedmcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  authorization: {{ printf "Bearer %s" (include "sundhedmcp.apiToken" .) | quote }}
---
{{- end }}
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: {{ $k.remoteMCPServer.name }}
  namespace: {{ $k.namespace }}
  labels:
    {{- include "sundhedmcp.labels" . | nindent 4 }}
    {{- if and $multi (not $k.remoteMCPServer.discovery) }}
    # The controller lists tools without a user's token, which multi-user
    # mode refuses unless discovery is on (SUNDHEDMCP_ANONYMOUS_TOOL_LIST).
    kagent.dev/discovery: disabled
    {{- end }}
spec:
  description: {{ $k.remoteMCPServer.description | quote }}
  protocol: STREAMABLE_HTTP
  url: {{ include "sundhedmcp.mcpUrl" . }}
  timeout: {{ $k.remoteMCPServer.timeout }}
  {{- if $multi }}
  # Forward the signed-in user's token; sundhedmcp picks their session by it.
  tokenPassthrough: true
  {{- else }}
  headersFrom:
    - name: Authorization
      valueFrom:
        type: Secret
        name: {{ $headerSecret }}
        key: authorization
  {{- end }}
{{- if $k.agent.enabled }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: {{ $k.agent.name }}
  namespace: {{ $k.namespace }}
  labels:
    {{- include "sundhedmcp.labels" . | nindent 4 }}
spec:
  harnessRef:
    name: {{ $k.agent.harness }}
  template:
    inline:
      description: {{ $k.agent.description | quote }}
      modelConfig:
        name: {{ $k.agent.modelConfig }}
      systemPrompt: |
        {{- $k.agent.systemPrompt | nindent 8 }}
      tools:
        - mcp:
            server:
              kind: RemoteMCPServer
              name: {{ $k.remoteMCPServer.name }}
{{- end }}
{{- end }}
