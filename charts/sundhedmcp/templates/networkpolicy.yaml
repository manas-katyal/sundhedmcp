{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sundhedmcp.fullname" . }}
  labels:
    {{- include "sundhedmcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sundhedmcp.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "sundhedmcp.clientLabel" . | nindent 14 }}
        {{- if .Values.kagent.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.kagent.namespace }}
        {{- end }}
        {{- with .Values.networkPolicy.from }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: http
{{- end }}
