{{- include "sundhedmcp.validate" . }}
{{- $fullname := include "sundhedmcp.fullname" . }}
{{- if not .Values.adminPassword.existingSecret }}
{{- $name := printf "%s-admin" $fullname }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sundhedmcp.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.adminPassword.secretKey }}: {{ include "sundhedmcp.keptRandom" (dict "root" . "name" $name "key" .Values.adminPassword.secretKey "length" 24) | quote }}
{{- end }}
{{- if and (include "sundhedmcp.apiTokenEnabled" .) (not .Values.apiToken.existingSecret) }}
{{- $name := printf "%s-api-token" $fullname }}
{{- $token := include "sundhedmcp.apiToken" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sundhedmcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.apiToken.tokenKey }}: {{ $token | quote }}
{{- end }}
