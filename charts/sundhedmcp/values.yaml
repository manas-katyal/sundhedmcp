# Build the image from the repository root (see Dockerfile) and push it, or
# load it into kind with `kind load image-archive`. The published image is
# ghcr.io/<owner>/sundhedmcp, tagged `latest` and with each commit sha; pin a
# sha in production.
image:
  repository: ghcr.io/manas-katyal/sundhedmcp
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The address people open in a browser (BASE_URL): the OAuth issuer, and the
# /connect page where the person logs in with MitID. The default suits
# `kubectl port-forward svc/<release>-sundhedmcp 8080`; set the public URL
# when httpRoute is on.
baseUrl: http://localhost:8080

# Let people ask their GP to renew a prescription through sundhed.dk (MCP
# tool renew_prescription, POST /api/v1/renewals, the dashboard's "Renew
# prescription" page). The only thing that writes to sundhed.dk; with
# several people the token also needs oidc.apiWriteScope.
allowRenewal: false

# single-user: one person, signed in with the admin password (OAuth for
#   claude.ai, an API token for kagent).
# multi-user: everyone signs in with oidc.issuer, and each person gets their
#   own sundhed.dk session and saved copy (see README, "Several people").
#   No admin password or API token then.
mode: single-user

oidc:
  # e.g. https://keycloak.example.com/realms/kagent
  issuer: ""
  # Access tokens for /mcp must list this in `aud`.
  audience: sundhedmcp
  # Accept Keycloak ID tokens as well as access tokens. kagent's oauth2-proxy
  # forwards ID tokens, so turn this on with kagent.
  acceptIdToken: false
  # The client the /connect page signs people in with (redirect URI
  # <baseUrl>/connect/callback). Leave the secret empty for a public client.
  clientId: sundhedmcp-connect
  clientSecret:
    existingSecret: ""
    secretKey: client-secret
  # The scope a token needs for the /api/v1 calls that change something
  # (fetch again, log out, delete the copy). "" lets any valid token.
  apiWriteScope: sundhed:write

# The password for signing in to the server (OAuth, and the /connect page).
# Single-user mode only.
# Without existingSecret the chart creates a Secret with a random password,
# kept across upgrades; NOTES.txt shows how to read it.
adminPassword:
  existingSecret: ""
  secretKey: ADMIN_PASSWORD

# Bearer tokens /mcp accepts besides OAuth (SUNDHEDMCP_API_TOKENS), for
# clients that cannot sign in with the password, such as kagent. On when
# kagent.enabled in single-user mode; never in multi-user mode. Without existingSecret the chart creates a Secret with a
# random token, kept across upgrades. With kagent, the chart copies it as an
# Authorization header Secret into kagent's namespace.
apiToken:
  enabled: false
  existingSecret: ""
  tokenKey: token

# Saved copy of the record, encrypted (see README, "Storage of the saved copy").
storage:
  # sqlite (a file on the data volume), postgres, or none (memory only).
  type: sqlite
  postgres:
    # Secret holding the connection URL. For CloudNativePG this is the
    # <cluster>-app secret, whose `uri` key has the URL.
    existingSecret: ""
    urlKey: uri
  # The storage key (32 random bytes, base64). Without existingSecret it is
  # generated into storage.key on the data volume. Keep a copy: without the
  # key the saved copy cannot be read (it is fetched again at the next login).
  key:
    existingSecret: ""
    secretKey: SUNDHEDMCP_STORAGE_KEY
    # Optional key in the same Secret with earlier keys, comma-separated.
    previousKeysKey: SUNDHEDMCP_STORAGE_PREVIOUS_KEYS

# Fetch each part of the record again while the session lasts (SUNDHEDMCP_SYNC).
sync:
  enabled: true

# How often to touch the sundhed.dk session so it is kept (ms; 0 turns it off).
keepAliveMs: 240000

# OAuth state, the password hash, the SQLite file and the storage key.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 1Gi

service:
  type: ClusterIP
  port: 8080

# Gateway API route to the whole server: OAuth, /connect and /mcp. Every
# path needs the admin password or a token, so it may be public; set baseUrl
# to the public URL. When networkPolicy is on, allow the gateway in
# networkPolicy.from.
httpRoute:
  enabled: false
  parentRefs: []
  hostnames: []
  annotations: {}

# Limit who can reach the pod: kagent's namespace (with kagent.enabled), pods
# with the chart's client label (helm test), and networkPolicy.from.
networkPolicy:
  enabled: false
  from: []

kagent:
  enabled: false
  namespace: kagent
  remoteMCPServer:
    name: sundhedmcp
    description: The signed-in person's own sundhed.dk record (read only)
    timeout: 60s
    # Multi-user mode: kagent lists the tools without a signed-in user, so
    # initialize and tools/list answer without a token
    # (SUNDHEDMCP_ANONYMOUS_TOOL_LIST). Tool calls still need the person's.
    # With false, kagent discovery is off and kagent shows no tools.
    discovery: true
  agent:
    enabled: false
    name: sundhed-assistant
    harness: kagent-default
    modelConfig: default-model-config
    description: Answers questions about the person's own sundhed.dk record.
    systemPrompt: |
      You help a person read their own health record on sundhed.dk: medicine,
      prescriptions, lab results, vaccinations and referrals. Answer in the
      language they write in. You only read; you cannot change anything on
      sundhed.dk. Do not give medical advice beyond explaining what the
      record says; for anything else, suggest asking their doctor. Start with
      get_summary. If a tool says the person is not logged in, tell them to
      log in with MitID at the link it gives, on a computer, and stop.

# OpenTelemetry: traces, metrics and logs over OTLP/HTTP to a collector. Off
# by default. Only route templates, tool, part and sundhed.dk app names,
# status codes and durations leave the pod; log lines are scrubbed of CPR
# numbers, ids, uuids and e-mail addresses. Never health data.
telemetry:
  enabled: false
  # OTLP/HTTP base URL of a collector, e.g.
  # http://otel-collector.observability.svc.cluster.local:4318
  # (/v1/traces, /v1/metrics and /v1/logs are added).
  endpoint: ""
  # service.name; empty means the release's full name.
  serviceName: ""
  signals:
    traces: true
    metrics: true
    logs: true
  # Share of new traces kept, 0..1. A caller's sampled traceparent is kept.
  traceSampleRatio: 1
  metricIntervalSeconds: 30
  # Extra resource attributes (OTEL_RESOURCE_ATTRIBUTES), e.g.
  # deployment.environment.name: homelab
  resourceAttributes: {}

# A Perses dashboard for the telemetry above, as a ConfigMap for the Perses
# provisioning sidecar (it picks up ConfigMaps carrying `labels`). Off by
# default. Needs telemetry.signals.metrics; the trace and log rows need
# traces and logs too, and a Tempo and a Loki datasource in Perses.
perses:
  enabled: false
  # Namespace for the ConfigMap; empty means the release namespace. Set it
  # when the sidecar watches one namespace only.
  namespace: ""
  labels:
    perses.dev/resource: "true"
  annotations: {}
  project:
    # The Perses project the dashboard goes in.
    name: sundhedmcp
    # Also create that project. false when it exists already (shared with
    # other apps) or is made elsewhere.
    create: true
    displayName: sundhedmcp
    description: SundhedMCP, the sundhed.dk MCP server
  dashboard:
    name: sundhedmcp
    displayName: sundhedmcp
    duration: 6h
    refreshInterval: 1m
  # Perses datasource names; empty uses the project's or global default of
  # that kind.
  datasources:
    prometheus: ""
    tempo: ""
    loki: ""
  # Label matchers that pick this service's metrics, without braces. Empty
  # means job="<serviceName>", what the collector's Prometheus exporter sets.
  # Behind a scraped collector it is often exported_job="<serviceName>".
  metricSelector: ""
  # Loki stream selector for the logs. Empty means {service_name="<serviceName>"}.
  logSelector: ""
  # Toolbar links: [{name, url, tooltip}].
  links: []

podAnnotations: {}
podLabels: {}
# Chromium runs in the pod, so it needs more memory than the server alone.
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 1536Mi
# Chromium uses /dev/shm; the container default (64Mi) is too small.
shmSize: 256Mi
nodeSelector: {}
tolerations: []
affinity: {}
extraEnv: []

tests:
  image: curlimages/curl:8.17.0
