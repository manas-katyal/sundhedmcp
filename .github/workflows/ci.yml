name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # 26 is what the image runs; 24 is the oldest engines allows.
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7

      # pnpm version is read from package.json's "packageManager" field.
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The published package must hold the bundle, with no workspace imports left.
      - name: Pack
        run: |
          pnpm --filter sundhedmcp pack --pack-destination "$RUNNER_TEMP"
          ! grep -rl '@sundhedmcp/' packages/mcp-server/dist/lib

  # The image must still build; it is only pushed from main (image.yml).
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
